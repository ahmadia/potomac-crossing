<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potomac Crossing</title>
<meta name="description" content="A graphic-novel story game: a pillow cat joins CrystalClan on a mythic Potomac River.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#211a3d">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Potomac Crossing">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --ink:#1b1622; --ink-2:#3a3046;
  --dusk-0:#140f26; --dusk-1:#211a3d; --dusk-2:#3a2858; --plum:#5a3466; --ember:#f39a4a;
  --gold:#ffd23f; --gold-2:#ffb52e; --cream:#fffaf0; --paper:#fbf3df; --caption:#ffe8a3;
  --leaf:#86c46f; --sky:#9fd3ff; --rose:#ff8fa3; --good:#3fa45b;
  --text:#fff6e4; --text-dim:#cdbfe0;
  --comic:"Comic Neue","Chalkboard SE","Comic Sans MS",ui-rounded,sans-serif;
  --shout:"Bangers","Marker Felt",Impact,sans-serif;
  --digits:"Andika",ui-rounded,system-ui,sans-serif;   /* times-table numbers: a 1 with a foot, a plain 7 and 0 */
  --fs:clamp(17px, 1.1vw + 12px, 22px);
  --scale:1;
  --bar:56px;
  --lift:0 0 0 2px rgba(255,246,228,.85), 5px 5px 0 2px rgba(0,0,0,.5);
  --lift-press:0 0 0 2px rgba(255,246,228,.85), 1px 1px 0 2px rgba(0,0,0,.5);
  --gap:16px;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
html.big{--scale:1.2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--comic);font-size:calc(var(--fs) * var(--scale));line-height:1.35;color:var(--text);
  background:
    radial-gradient(130% 70% at 50% -10%, var(--plum) 0%, rgba(90,52,102,0) 60%),
    radial-gradient(90% 50% at 80% 110%, rgba(243,154,74,.18) 0%, rgba(243,154,74,0) 70%),
    linear-gradient(180deg, var(--dusk-1) 0%, var(--dusk-0) 100%);
  background-attachment:fixed;min-height:100dvh;overflow-x:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
a{color:var(--gold)}
[hidden]{display:none!important}
#app{overflow-x:clip}   /* the .enter slide never widens the page sideways */
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;
  padding:calc(6px + var(--st)) calc(10px + var(--sr)) 6px calc(10px + var(--sl));min-height:calc(var(--bar) + var(--st));
  background:linear-gradient(180deg, rgba(20,15,38,.92), rgba(20,15,38,.72));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar-title{flex:1;min-width:0;font-family:var(--shout);font-size:22px;letter-spacing:.04em;color:var(--gold);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 var(--ink)}
.bar-title small{font-family:var(--comic);font-size:14px;letter-spacing:0;color:var(--text-dim);text-shadow:none;margin-left:8px;font-weight:700}
.iconbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--text);
  border:2px solid rgba(255,246,228,.18);background:rgba(255,246,228,.06);flex:none}
.iconbtn svg{width:26px;height:26px}
.iconbtn[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.iconbtn.text{font-weight:700;font-size:19px;font-family:var(--comic)}
.iconbtn:active{transform:translate(1px,1px)}
.iconbtn.invisible{visibility:hidden}

/* ---------- screens ---------- */
#screen{padding:12px calc(16px + var(--sr)) calc(28px + var(--sb)) calc(16px + var(--sl));min-height:calc(100dvh - var(--bar) - var(--st))}
.enter{animation:enter .26s ease-out both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.enter-back{animation:enterback .26s ease-out both}
@keyframes enterback{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* ---------- the comic frame ---------- */
.frame{display:flex;flex-direction:column;gap:14px;max-width:880px;margin:0 auto;min-height:calc(100dvh - var(--bar) - var(--st) - 52px);justify-content:center}
/* portrait: captions over the panel, then the panel, then stacked balloons and the interaction */
.frame .col{display:contents}
.frame .col-top{order:0;display:flex;flex-direction:column;gap:10px}
.frame .panel-side{order:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.frame .stack{order:2}
.frame .interact{order:3;display:flex;flex-direction:column;gap:12px}
.frame .col-top:empty,.frame .stack:empty,.frame .interact:empty{display:none}
.panel{position:relative;width:min(100%, calc((100dvh - var(--bar) - var(--st) - 40px) * 1.6));aspect-ratio:16/10;
  border:4px solid var(--ink);border-radius:6px;overflow:hidden;background:#2b2347;
  box-shadow:0 0 0 3px var(--cream), 7px 7px 0 3px rgba(0,0,0,.45);margin:3px 0 0 3px;flex:none}
.panel.tappable{cursor:pointer}
.panel .art,.panel .art > svg,.panel .art > img{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel .art > img{object-fit:cover}
.panel .ov{position:absolute;inset:0;pointer-events:none}
.panel .ov > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.panel .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.ov .btext{position:absolute;font-family:var(--comic);font-weight:700;color:var(--ink);text-align:center;
  font-size:var(--bfs,18px);line-height:1.22;padding:0;margin:0;overflow-wrap:break-word;hyphens:manual}
.ov .btext.shout{font-family:var(--shout);font-weight:400;letter-spacing:.03em;font-size:calc(var(--bfs,18px) * 1.18);line-height:1.08}
.ov .btext.whisper{font-weight:400;font-style:italic}
.ov .btext.think{font-weight:400}
.ov .ctext{position:absolute;font-family:var(--comic);font-weight:700;color:var(--ink);font-size:var(--bfs,18px);line-height:1.25;
  background:var(--caption);border:3px solid var(--ink);padding:.35em .6em;box-shadow:3px 3px 0 rgba(27,22,34,.55);margin:0}
.ov .tagin{display:table;margin:0 auto .2em;font-family:var(--comic);font-size:.62em;font-weight:700;letter-spacing:.02em;line-height:1.3;background:var(--ink);color:var(--cream);border-radius:999px;padding:.05em .75em;white-space:nowrap}
/* a balloon's digits (the Warrior Counts she watches: "7 × 8", "56"), small in Andika on a tag under its edge */
.dpill{font-family:var(--digits);font-weight:700;letter-spacing:.04em;line-height:1.15;white-space:nowrap;background:var(--ink);color:var(--gold);
  border:2px solid var(--cream);border-radius:999px;padding:.08em .62em .12em;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.ov .dpill{position:absolute;font-size:calc(var(--bfs,18px) * .82)}
.sb .dpill{display:inline-block;margin:0 0 0 .5em;font-size:.82em;font-style:normal;vertical-align:.1em}

/* captions (narration boxes) */
.caption{margin:0;background:var(--caption);color:var(--ink);border:3px solid var(--ink);border-radius:3px;
  padding:.5em .75em;font-weight:700;box-shadow:4px 4px 0 rgba(0,0,0,.4);transform:rotate(-.35deg)}
.caption:nth-child(even){transform:rotate(.3deg)}
.caption em{font-style:italic}

/* balloons stacked under the panel when space is tight */
.stack{display:flex;flex-direction:column;gap:12px}
.sb{position:relative;margin:4px 0 0 10px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:26px;
  padding:.55em .9em .6em;font-weight:700;box-shadow:3px 3px 0 rgba(0,0,0,.4);align-self:flex-start;max-width:100%}
.sb::before{content:"";position:absolute;left:26px;top:-15px;width:18px;height:18px;background:var(--cream);
  border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:skewX(28deg) rotate(18deg);border-radius:2px 0 0 0}
.sb .who{display:inline-block;font-size:.68em;background:var(--ink);color:var(--cream);border-radius:999px;padding:.05em .7em;margin:0 .45em .2em 0;vertical-align:.12em;letter-spacing:.02em}
.sbrow{display:flex;align-items:flex-end;gap:8px;align-self:flex-start;max-width:100%}
.sbrow.right{align-self:flex-end;flex-direction:row-reverse}
.sbrow .sb{align-self:auto;min-width:0}
.sface{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 50% 35%, #ffe6b8, #e9a868);overflow:hidden;box-shadow:2px 2px 0 rgba(0,0,0,.4);margin-bottom:-2px}
.sface svg{width:100%;height:100%;display:block}
.sface + .sb{margin:0 0 0 6px}
.sface + .sb::before{left:-12px;top:auto;bottom:12px;width:15px;height:15px;border:0;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg);border-radius:0 0 0 3px}
.sbrow.right .sface + .sb{margin:0 6px 0 0}
.sbrow.right .sface + .sb::before{left:auto;right:-12px;border-left:0;border-bottom:0;border-right:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg);border-radius:0 3px 0 0}
.sb.right{align-self:flex-end;margin:4px 10px 0 0}
.sb.right::before{left:auto;right:26px;transform:skewX(-28deg) rotate(-18deg) scaleX(-1)}
.sb.shout{border-width:4px;border-radius:12px;font-family:var(--shout);font-weight:400;letter-spacing:.03em;font-size:1.15em}
.sb.shout .who{font-family:var(--comic);font-weight:700;letter-spacing:0;font-size:.6em}
.sb.whisper{border-style:dashed;font-weight:400;font-style:italic}
.sb.think{border-radius:40px;font-weight:400}

/* sound effects live in the overlay svg */
.sfx text{font-family:var(--shout);paint-order:stroke fill;stroke:var(--ink);stroke-linejoin:round}
.sfx{transform-box:fill-box;transform-origin:center}
.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-14deg);opacity:0}100%{transform:scale(1);opacity:1}}

/* fx owned by the UI */
.fx-shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-1px)}}
.fx-flash .flash{animation:flash .7s ease-out both}
@keyframes flash{0%{opacity:0}12%{opacity:.92}30%{opacity:.15}42%{opacity:.6}100%{opacity:0}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:56px;padding:.45em 1.2em;border-radius:16px;
  background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--lift);font-weight:700;
  text-decoration:none;transition:transform .06s, box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:var(--lift-press)}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;filter:saturate(.4)}
.btn.go{background:var(--gold)}
.btn.big{font-size:1.15em;min-height:64px;padding:.4em 1.5em}
.btn.quiet{background:rgba(255,250,240,.12);color:var(--text);border-color:rgba(255,246,228,.5);box-shadow:none}
.btn svg{width:1.1em;height:1.1em}
.next-row{display:flex;justify-content:flex-end;gap:12px;align-items:center;position:sticky;bottom:calc(10px + var(--sb));z-index:5;pointer-events:none}
.next-row .btn{pointer-events:auto}
/* a page of choices has no Next to keep in reach: Back keeps its place under the options (sticky, on a
   page taller than the screen, it floated over them, and a tap on an option's words went Back) */
.frame[data-kind="choice"] .next-row{position:static}
/* Back sits at the left of every frame's bottom row, as big as Next; invisible (but holding its place)
   on the first frame */
.btn.back{margin-right:auto}
.btn.back.nohist{visibility:hidden}
/* a row too narrow for everything (the landscape text column) wraps upward: Back stays bottom-left,
   the main button moves up to the right */
.next-row:has(> .btn.back),.row.end:has(> .btn.back){flex-wrap:wrap-reverse}
.next-row .btn,.row.end .btn{white-space:nowrap}
/* the look chooser: "That's me!" rides along the bottom on an opaque strip the column's width, so a
   tap beside it never lands on a swatch underneath */
.frame[data-kind="look"] .next-row{position:sticky;bottom:0;pointer-events:auto;padding:16px 0 calc(10px + var(--sb));margin-top:-6px;
  background:linear-gradient(180deg, rgba(20,15,38,0) 0, var(--dusk-0) 14px)}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:block;width:100%;text-align:left;min-height:60px;padding:.6em .9em .6em 3em;position:relative;
  background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:var(--lift);font-weight:700;
  transition:transform .06s, box-shadow .06s}
.choice:nth-child(odd){transform:rotate(-.4deg)}
.choice:nth-child(even){transform:rotate(.35deg)}
.choice::before{content:attr(data-n);position:absolute;left:.55em;top:50%;margin-top:-.85em;width:1.7em;height:1.7em;border-radius:50%;
  background:var(--gold);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--shout);font-size:.95em;line-height:1}
.choice:active{transform:translate(3px,3px);box-shadow:var(--lift-press)}
.prompt{margin:2px 0 0;font-weight:700;color:var(--gold);font-size:1.02em}

/* ---------- inputs ---------- */
.field{width:100%;min-height:60px;padding:.4em .7em;border-radius:12px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);
  font-weight:700;font-size:1.1em;box-shadow:inset 2px 2px 0 rgba(0,0,0,.08)}
textarea.field{min-height:120px;resize:vertical;line-height:1.3}
.field::placeholder{color:#9b8fa8;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:50px;padding:.3em 1em;border-radius:999px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);
  box-shadow:var(--lift);font-weight:700}
.chip[aria-pressed="true"]{background:var(--gold)}
.chip:active{transform:translate(2px,2px);box-shadow:var(--lift-press)}
.preview{font-family:var(--shout);font-size:1.7em;letter-spacing:.03em;color:var(--gold);text-shadow:3px 3px 0 var(--ink);min-height:1.2em;line-height:1.1}
.preview small{display:block;font-family:var(--comic);font-size:.48em;letter-spacing:0;color:var(--text-dim);text-shadow:none;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.hint{color:var(--text-dim);font-size:.85em;margin:0}

/* ---------- look chooser ---------- */
.look{display:flex;flex-direction:column;gap:14px}
.look h3{margin:0 0 6px;font-family:var(--shout);font-weight:400;font-size:1.25em;letter-spacing:.04em;color:var(--gold);text-shadow:2px 2px 0 var(--ink)}
.sw-row{display:flex;flex-wrap:wrap;gap:10px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;width:88px;padding:4px 2px;border-radius:14px;color:var(--text);font-size:calc(var(--fs) * var(--scale) * .72);font-weight:700;line-height:1.1;text-align:center}
html.big .sw{font-size:max(15px, calc(var(--fs) * var(--scale) * .72))}
.sw.wide{width:7.7em}
.sw > span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;max-width:100%;overflow-wrap:anywhere}
.sw svg{width:58px;height:58px;display:block;border-radius:50%;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.45);background:#fff}
.sw[aria-pressed="true"]{background:rgba(255,210,63,.18)}
.sw[aria-pressed="true"] svg{border-color:var(--gold);box-shadow:0 0 0 3px var(--ink),0 0 14px 2px rgba(255,210,63,.65)}
.sw.word{width:auto;min-width:120px;flex-direction:row;padding:0}
.sw.word span{display:block;-webkit-line-clamp:none;line-clamp:none;overflow:visible;overflow-wrap:normal;max-width:none;min-height:54px;padding:.55em 1.1em;border-radius:14px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);font-size:calc(var(--fs) * var(--scale));box-shadow:var(--lift)}
.sw.word[aria-pressed="true"]{background:none}
.sw.word[aria-pressed="true"] span{background:var(--gold)}

/* ---------- the Counts ---------- */
.counts{display:flex;flex-direction:column;gap:12px;align-items:stretch;container-type:inline-size}
/* sized by the lesson column (cqi), not the window: "10 × 10 = 100" fits the narrowest column with
   a little to spare, in Andika's rounder (wider) numbers. (Safari sizes a cqi font by the page zoom
   too: at 115% the line was 15% bigger than its column allowed and the answer's last zero was cut
   off. So the slot never shrinks under its digits, and the page measures the line and sets it
   smaller when, and only when, it is wider than its column: ui.js, fitQ) */
.q{font-family:var(--digits);font-weight:700;font-size:52px;font-size:clamp(40px, 14cqi, 96px);max-width:100%;letter-spacing:.01em;line-height:1;text-align:center;color:var(--cream);
  text-shadow:4px 4px 0 var(--ink);display:flex;justify-content:center;align-items:center;gap:.22em;font-variant-numeric:tabular-nums;margin:2px 0}
.q .slot{flex:none;min-width:1.3em;padding:.06em .25em .02em;border-radius:12px;border:4px solid var(--ink);background:var(--cream);color:var(--ink);text-shadow:none;box-shadow:var(--lift)}
.q .slot.empty{color:#b9a9c9}
.q .slot.right{background:#c9f2c0}
.q .slot.miss{background:var(--caption)}
.q .x{color:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;width:100%;margin:0 auto}
.key{min-height:64px;border-radius:16px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--lift);
  font-family:var(--digits);font-weight:700;font-size:32px;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.key:active{transform:translate(3px,3px);box-shadow:var(--lift-press)}
.key.ok{background:var(--gold)}
.key.del svg{width:34px;height:34px}
.key:disabled{opacity:.4}
.keypad.locked .key{pointer-events:none}
.padwrap{position:relative;width:100%}
.keypad.away{visibility:hidden}
.gotit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.frame[data-kind="lesson"]{justify-content:flex-start}
.lesson-panel{background:#e8cf98}
.lesson-panel .art > svg{background:#e8cf98}
.counter{font-family:var(--digits);font-weight:700;font-size:1.25em;letter-spacing:.03em}

/* ---------- title ---------- */
.title-screen{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:calc(100dvh - var(--bar) - var(--st) - 52px)}
.tagline{margin:0;text-align:center;font-weight:700;color:var(--text-dim);font-size:1.05em}
.title-screen .panel{width:min(100%, calc((100dvh - var(--bar) - 250px) * 1.6))}
.logo{position:absolute;left:0;right:0;top:6%;text-align:center;font-family:var(--shout);font-size:clamp(40px, 9.5vw, 104px);line-height:.92;
  letter-spacing:.04em;color:var(--gold);-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),6px 7px 0 rgba(27,22,34,.6);
  transform:rotate(-2.5deg);pointer-events:none}
.logo small{display:block;font-size:.34em;letter-spacing:.08em;color:var(--cream)}
.title-cta{display:flex;flex-direction:column;align-items:center;gap:14px}

/* ---------- who's playing ---------- */
.page{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.h1{font-family:var(--shout);font-weight:400;font-size:clamp(34px, 5vw, 54px);overflow-wrap:anywhere;letter-spacing:.04em;color:var(--gold);text-shadow:3px 3px 0 var(--ink);margin:6px 0 0;line-height:1;text-align:center}
.h2{font-family:var(--shout);font-weight:400;font-size:1.6em;letter-spacing:.04em;color:var(--gold);text-shadow:2px 2px 0 var(--ink);margin:0;line-height:1.05}
.page.center{min-height:calc(100dvh - var(--bar) - var(--st) - 52px);justify-content:center}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.cats .catcard{width:216px}
.catcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 16px;border-radius:10px;background:var(--cream);color:var(--ink);
  border:4px solid var(--ink);box-shadow:var(--lift);text-align:center;min-height:250px}
.catcard:nth-child(odd){transform:rotate(-.8deg)}
.catcard:nth-child(even){transform:rotate(.7deg)}
.catcard:active{transform:translate(3px,3px);box-shadow:var(--lift-press)}
.catcard .face{width:150px;height:130px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 40%, #ffe6b8, #f3b875)}
.catcard .face svg{width:100%;height:100%;display:block}
.catcard b{font-size:1.15em;line-height:1.1;overflow-wrap:anywhere;max-width:100%}
.catcard b.long{font-size:.86em}   /* "Thunderwhiskerpaw" fits one line, Bigger text too */
.catcard span{font-size:.8em;color:#5a4d66;font-weight:700}
.catcard.new{background:rgba(255,250,240,.1);color:var(--text);border-style:dashed;border-color:var(--cream);box-shadow:none}
.catcard.new .face{background:rgba(255,250,240,.08);font-family:var(--shout);font-size:80px;color:var(--gold)}
.catcard.new span{color:var(--text-dim)}
.note{color:var(--text-dim);text-align:center;font-size:.9em;margin:0}

/* ---------- hub, book, hollow, nest ---------- */
.hub{display:grid;grid-template-columns:1fr;gap:14px;max-width:560px;margin:0 auto;width:100%}
.hub .btn{justify-content:flex-start;text-align:left;min-height:66px;font-size:1.05em}
.hub .btn i{font-style:normal;display:grid;place-items:center;width:44px;height:44px;flex:none}
.hub .btn i svg{width:40px;height:40px}
.hero{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.hero .face{width:170px;height:150px}
.hero .face svg{width:100%;height:100%}

.book{max-width:760px;margin:0 auto;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:6px;
  box-shadow:8px 8px 0 rgba(0,0,0,.45);padding:28px clamp(18px, 4vw, 44px) 32px;position:relative}
.book::after{content:"";position:absolute;inset:8px;border:2px solid rgba(27,22,34,.18);border-radius:3px;pointer-events:none}
.book h1{font-family:var(--shout);font-weight:400;font-size:clamp(38px, 6vw, 62px);overflow-wrap:anywhere;letter-spacing:.04em;line-height:1;margin:0;text-align:center;color:var(--ember);
  text-shadow:3px 3px 0 var(--ink)}
.book h1.long{font-size:clamp(28px, 4.6vw, 50px)}
.book .chap{text-align:center;font-weight:700;margin:6px 0 14px;color:var(--ink-2)}
.book h2.chap{font-family:var(--shout);font-weight:400;font-size:1.55em;letter-spacing:.04em;color:var(--ink);margin:18px 0 10px;line-height:1.05}
.book .bookpage + .bookpage{border-top:3px dashed rgba(27,22,34,.25);padding-top:6px;margin-top:18px}
.book .bookpage{scroll-margin-top:calc(var(--bar) + var(--st) + 14px)}   /* "See your book" lands on her page below the sticky bar */
.book .bookpage:first-of-type h2.chap{margin-top:4px}
.book .portrait{width:min(300px, 70%);margin:6px auto 12px;aspect-ratio:1/0.9;border:4px solid var(--ink);border-radius:50% 50% 46% 46%;overflow:hidden;
  background:radial-gradient(circle at 50% 35%, #ffe2a6, #f0a868 70%, #c9785a)}
.book .portrait svg{width:100%;height:100%;display:block}
.book p{margin:0 0 .7em}
.book .dream{background:var(--caption);border:3px solid var(--ink);padding:.6em .9em;font-style:italic;box-shadow:3px 3px 0 rgba(0,0,0,.25);margin-top:14px}
.book .sig{text-align:right;color:var(--ink-2);font-size:.85em;margin-top:16px}
/* the dragonets: a page for each she has found (room for her own drawing), the rest as silhouettes */
.book .dragonet{display:flex;gap:16px;align-items:flex-start;margin:6px 0 12px}
.book .dn-pic{flex:none;width:clamp(110px, 26%, 190px);aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;overflow:hidden;
  background:radial-gradient(circle at 50% 30%, #dfe8ee, #a9b8c4 75%)}
.book .dn-pic svg{width:100%;height:100%;display:block}
.book .dn-text{flex:1;min-width:0}
.book .dn-text h3{font-family:var(--shout);font-weight:400;font-size:1.5em;letter-spacing:.04em;margin:0 0 .2em}
.book .dn-draw{border:3px dashed rgba(27,22,34,.4);border-radius:10px;min-height:150px;display:flex;align-items:flex-end;justify-content:flex-end;
  padding:6px 10px;color:rgba(27,22,34,.55);font-size:.8em;font-style:italic;margin-top:8px}
.book .dn-find{display:grid;grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));gap:10px;margin-top:6px}
.book .dragonet.sil{flex-direction:column;align-items:center;margin:0}
.book .dn-more{text-align:center;font-weight:700;color:var(--ink-2);margin:.5em 0 0}
.book .dragonet.sil .dn-pic{width:100%;background:radial-gradient(circle at 50% 30%, #f3e9d2, #d9c7a1 80%)}
.book .dragonet.sil .dn-pic svg{filter:brightness(0);opacity:.42}
.coming{max-width:760px;margin:22px auto 0;background:linear-gradient(135deg, #2c2257, #4a2a5c);border:4px solid var(--ink);border-radius:8px;
  padding:20px 22px;box-shadow:6px 6px 0 rgba(0,0,0,.5);position:relative;overflow:hidden}
.coming .h2{font-size:1.9em}
.coming p{margin:.5em 0 0}
.coming .soon{display:inline-block;font-family:var(--shout);letter-spacing:.05em;background:var(--ember);color:var(--ink);padding:.1em .6em;border:3px solid var(--ink);transform:rotate(-3deg);margin-bottom:6px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px auto 0;max-width:760px}

.solo-panel{display:flex;justify-content:center}
.solo-panel .panel{width:min(100%, 760px, calc((100dvh - var(--bar) - 260px) * 1.6))}
.endcap{margin:4px 0 0;text-align:center;font-family:var(--shout);font-size:2em;letter-spacing:.06em;color:var(--gold);text-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.nest-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:14px}
.treasure{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:var(--lift);
  padding:10px 10px 12px;text-align:center;font-weight:700;font-size:.85em;line-height:1.2;position:relative}
.treasure svg{width:84px;height:84px;display:block;margin:0 auto 6px}
.treasure .n{position:absolute;top:6px;right:8px;background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-size:.9em}
.reward{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px;background:var(--cream);color:var(--ink);
  border:4px solid var(--ink);border-radius:12px;box-shadow:var(--lift);max-width:420px;margin:0 auto}
.reward svg{width:130px;height:130px}
.glow-note{color:var(--gold);font-weight:700;text-align:center}
/* chapter 2: the hub's next chapter, the Hollow's Counts, gifts in the nest */
.hub .btn.hub-next{min-height:78px;font-size:1.12em}
.hub .hub-next span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.12}
.hub .hub-next small{font-size:.68em;font-weight:700;opacity:.75;margin-top:3px}
.counts-pick{display:grid;grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));gap:12px}
.counts-pick .btn{width:100%}
.glowdot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:radial-gradient(circle, #fff6b0 0, #ffd23f 45%, #ff9f1c 100%);
  box-shadow:0 0 10px 3px rgba(255,210,63,.75);border:2px solid var(--ink);margin-right:.15em;flex:none}
/* on a gold button a gold dot vanished into it (it read as an empty radio button): a sparkle there */
.btn.go .glowdot{width:1.15em;height:1.15em;background:none;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 0 4px #fff)}
.glowdot svg{display:none}
.btn.go .glowdot svg{display:block;width:100%;height:100%;fill:#fffbe6;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.nest-h{margin:8px 0 -4px;font-size:1.35em}
.treasure small{display:block;font-weight:700;font-size:.92em;color:#7a5b2e;margin-top:3px}
.treasure.gift{background:#fff1c9}
.giftnote{display:flex;align-items:center;gap:10px;margin:0;align-self:center;padding:6px 16px 6px 8px;border-radius:999px;background:var(--cream);color:var(--ink);
  border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.4);font-weight:700;font-size:.92em;line-height:1.2}
.giftnote svg{width:44px;height:44px;flex:none}
/* the skip-count: the big running number over the picture (2, 4, 6…) */
.skipnum{position:absolute;left:0;right:0;top:2%;text-align:center;font-family:var(--digits);font-weight:700;font-size:clamp(40px, 7vw, 104px);line-height:1;
  color:var(--gold);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);font-variant-numeric:tabular-nums;pointer-events:none}
.skipnum.pop{transform-origin:50% 40%}
/* one group (Squall's raised forepaw): the number grows beside its lit claws, on the bare ground to
   the right of the picture's one cell; at the top centre it sat on his face */
.skipnum.one{left:71%;right:0;top:24%;text-align:left}
.skipnum.one.pop{transform-origin:15% 40%}
/* the glowing cat: a tap on it counts; a tap anywhere else makes it wiggle (no line, no penalty) */
.pc-hop{transform-box:fill-box;transform-origin:50% 100%}
.pc-hop.wiggle{animation:hopwiggle .55s ease-in-out}
@keyframes hopwiggle{0%,100%{transform:rotate(0)}18%{transform:rotate(-8deg)}38%{transform:rotate(7deg)}58%{transform:rotate(-5deg)}78%{transform:rotate(3deg)}}
.next-row .sr{pointer-events:auto}
/* the page a skip-count turns to: the number it reached, popping in */
.bignum{transform-box:fill-box;transform-origin:center}

/* ---------- chapter 4: her Case File, and the pages she taps ---------- */
/* its curl of bark in the top bar: there from the "Skritch" frame on, glowing on that frame, and
   wiggling once whenever a card goes in */
.iconbtn.filebtn{background:rgba(233,220,192,.16);border-color:rgba(233,220,192,.55)}
.iconbtn.filebtn svg{width:32px;height:32px;display:block}
.filebtn.glow{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.4),0 0 16px 5px rgba(255,210,63,.75);animation:fileglow 1.5s ease-in-out infinite}
@keyframes fileglow{0%,100%{box-shadow:0 0 0 2px rgba(255,210,63,.3),0 0 10px 2px rgba(255,210,63,.5);transform:none}50%{box-shadow:0 0 0 4px rgba(255,210,63,.55),0 0 22px 8px rgba(255,210,63,.9);transform:scale(1.09)}}
.filebtn.got,.filebtn.nudge{animation:filegot 1.1s ease-in-out 1}
.filebtn.nudge{animation-duration:.8s}
@keyframes filegot{0%{transform:none;box-shadow:0 0 0 0 rgba(255,210,63,0)}15%{transform:rotate(-14deg) scale(1.15)}35%{transform:rotate(12deg) scale(1.22);box-shadow:0 0 20px 8px rgba(255,210,63,.95);border-color:var(--gold)}55%{transform:rotate(-8deg) scale(1.12)}75%{transform:rotate(5deg) scale(1.05)}100%{transform:none;box-shadow:0 0 0 0 rgba(255,210,63,0)}}
/* the card a frame gives her, under its panel: its picture, its mark and its line, and no other words */
.cardnote{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;align-self:center;max-width:100%}
.cn-card{display:flex;align-items:center;gap:12px;max-width:100%;transform-origin:20% 60%}
.cn-pic{flex:none;width:92px;transform:rotate(-3deg);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.45))}
.cn-pic svg{display:block;width:100%;height:auto}
.cn-line{font-weight:700;color:var(--ink);background:#e9dcc0;border:3px solid var(--ink);border-radius:5px 13px 7px 11px;padding:.35em .75em .4em;box-shadow:3px 3px 0 rgba(0,0,0,.4);line-height:1.2;max-width:20em}
/* the instruction on a page she taps ("Tap the glitter."), and the curl shown in it on the file frame */
.tapline strong{color:var(--cream)}
.next-row .tapline{margin:0;pointer-events:auto;text-align:right;text-shadow:2px 2px 0 var(--ink)}
.tapicon{display:inline-block;width:2em;height:2em;vertical-align:middle;margin:-.5em 0 -.35em .15em;border-radius:10px;pointer-events:auto}
.tapicon svg{width:100%;height:100%;display:block}
/* the glitter Tap: the glint pulses softly; a tap on it makes it flare, a tap anywhere else makes it twinkle */
.tapspot{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
.tapspot svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 50%;animation:glint 1.6s ease-in-out infinite}
.ts-halo{fill:rgba(255,246,190,.34)}
.ts-star{fill:#fffbe6;stroke:#ffd23f;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 5px #fff)}
.ts-core{fill:#fff}
@keyframes glint{0%,100%{transform:scale(.7) rotate(0);opacity:.72}50%{transform:scale(1) rotate(14deg);opacity:1}}
.tapspot.twinkle svg{animation:twinkle .5s ease-out 1}
@keyframes twinkle{0%{transform:scale(.8) rotate(0)}30%{transform:scale(1.3) rotate(40deg)}60%{transform:scale(.9) rotate(72deg)}100%{transform:scale(.8) rotate(90deg)}}
.tapspot.flare svg{animation:flare .7s ease-out 1 forwards}
@keyframes flare{0%{transform:scale(1);opacity:1}55%{transform:scale(3.4) rotate(30deg);opacity:1}100%{transform:scale(5) rotate(45deg);opacity:0}}
/* ... and when the art draws the glint itself (the pile's star of light, which pulses on its own), that is what twinkles and flares */
.art [data-art="glint"]{transform-box:fill-box;transform-origin:center}
.art [data-art="glint"].twinkle{animation:arttwinkle .5s ease-out 1}
@keyframes arttwinkle{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.4) rotate(45deg)}100%{transform:scale(1) rotate(90deg)}}
.art [data-art="glint"].flare{animation:artflare .7s ease-out 1 forwards}
@keyframes artflare{0%{transform:scale(1);opacity:1}55%{transform:scale(2.4) rotate(30deg);opacity:1}100%{transform:scale(3.4) rotate(45deg);opacity:0}}
/* the bark Taps: curls of bark in a row on the sand, the next one glowing; each line under its piece */
.bark-panel{background:#e8cf98}
.bark-panel.ground-moss{background:#5d8246}
.bark-panel.ground-earth{background:#a27a55}
.bark-panel.ground-grit{background:#cbc7bc}
.bark-panel.ground-mud{background:#8f775a}
.bark-panel .art{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%, rgba(255,247,220,.6), rgba(255,247,220,0) 72%)}
.bark-row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:10px 2.6%;width:100%;padding:3% 3.5% 2%}
.bark{flex:0 1 21%;max-width:240px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.4em;transform-origin:50% 85%}
.bark-row.n1 .bark{flex-basis:31%}
.bark-row.n2 .bark{flex-basis:28%}
.bark-row.n3 .bark{flex-basis:25%}
.bark:nth-child(odd){transform:rotate(-2deg)}
.bark:nth-child(even){transform:rotate(1.6deg)}
.bark-pic{position:relative;display:block;width:100%;filter:drop-shadow(4px 5px 0 rgba(70,48,22,.38))}
.bark-pic svg{display:block;width:100%;height:auto}
.bark-line{display:block;min-height:2.4em;text-align:center;font-weight:700;color:var(--ink);line-height:1.18;overflow-wrap:break-word}
.ground-moss .bark-line,.ground-earth .bark-line,.ground-mud .bark-line{color:var(--cream);text-shadow:1.5px 1.5px 0 rgba(27,22,34,.7)}
.bark.next .bark-pic{filter:drop-shadow(0 0 10px rgba(255,214,70,.95)) drop-shadow(4px 5px 0 rgba(70,48,22,.38));animation:barkglow 1.5s ease-in-out infinite}
@keyframes barkglow{0%,100%{filter:drop-shadow(0 0 5px rgba(255,214,70,.7)) drop-shadow(4px 5px 0 rgba(70,48,22,.38))}50%{filter:drop-shadow(0 0 18px rgba(255,228,120,1)) drop-shadow(4px 5px 0 rgba(70,48,22,.38))}}
.bark.wiggle{animation:hopwiggle .55s ease-in-out}
.bark.fresh{animation:barkjig .5s ease-out}
@keyframes barkjig{0%{transform:scale(.9) rotate(-5deg)}40%{transform:scale(1.07) rotate(4deg)}70%{transform:scale(.98) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.skritch{position:absolute;left:50%;top:-9%;transform:translateX(-50%) rotate(-8deg);font-family:var(--shout);font-style:normal;font-size:1.3em;letter-spacing:.06em;line-height:1;white-space:nowrap;color:#fff6dc;
  text-shadow:2px 2px 0 var(--ink),-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink);pointer-events:none;animation:skritch 1.2s ease-out both}
@keyframes skritch{0%{opacity:0;transform:translateX(-50%) rotate(-8deg) scale(.4)}18%{opacity:1;transform:translateX(-50%) rotate(-8deg) scale(1.12)}78%{opacity:1;transform:translateX(-50%) rotate(-8deg) scale(1)}100%{opacity:0;transform:translateX(-44%) rotate(-5deg) scale(1)}}
/* the Case File's screen, over the page: her cards on moss, in two groups */
.cfile{position:fixed;inset:0;z-index:40;background:rgba(10,8,20,.8);display:flex;align-items:flex-start;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(18px + var(--sb)) calc(12px + var(--sl))}
html.file-open,html.file-open body{overflow:hidden}
.cf-in{width:100%;max-width:1180px;color:var(--ink);border:4px solid var(--ink);border-radius:14px;box-shadow:0 0 0 3px var(--cream), 8px 8px 0 3px rgba(0,0,0,.5);padding:12px clamp(12px, 2.2vw, 26px) 20px;
  background:radial-gradient(120% 90% at 18% 8%, #74994f 0, rgba(116,153,79,0) 58%),radial-gradient(90% 80% at 86% 92%, #4a6c38 0, rgba(74,108,56,0) 62%),#5d8246}
.cf-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cf-title{flex:1;min-width:0;margin:0;font-family:var(--shout);font-weight:400;font-size:clamp(28px, 4.4vw, 48px);letter-spacing:.04em;line-height:1;color:var(--gold);text-shadow:3px 3px 0 var(--ink);overflow-wrap:anywhere}
.cf-title.long{font-size:clamp(22px, 3.4vw, 38px)}
.cf-close,.cf-back{flex:none;min-height:50px;padding:.3em 1em}
.cf-back{margin-right:auto}
.cf-groups{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"ear" "link" "eye";gap:14px;align-items:start}
.cf-group{background:rgba(24,38,16,.3);border:3px solid rgba(27,22,34,.55);border-radius:14px;padding:10px 12px 14px;min-width:0}
.cf-group.eye{grid-area:eye}
.cf-group.ear{grid-area:ear}
.cf-link{grid-area:link}
.cf-h{margin:0 0 10px;display:flex;align-items:center;gap:.5em;font-family:var(--shout);font-weight:400;font-size:1.35em;letter-spacing:.04em;line-height:1.05;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
.cf-mark{font-style:normal;display:inline-grid;place-items:center;width:1.75em;height:1.3em;flex:none;color:var(--ink);background:#e9dcc0;border:2.5px solid var(--ink);border-radius:8px;text-shadow:none}
.cf-mark svg{width:1.3em;height:.92em;display:block}
.cf-cards{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px 10px}
.cf-card{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:4px 2px 6px;border-radius:12px;color:var(--cream);font-weight:700;font-size:.84em;line-height:1.16;text-align:center}
.cf-pic{display:block;width:min(100%, 132px);filter:drop-shadow(3px 4px 0 rgba(20,30,12,.5))}
.cf-pic svg{display:block;width:100%;height:auto}
.cf-card:nth-child(odd) .cf-pic{transform:rotate(-2.5deg)}
.cf-card:nth-child(even) .cf-pic{transform:rotate(2deg)}
.cf-card:active .cf-pic{transform:translate(2px,2px)}
.cf-line{display:block;text-shadow:1.5px 1.5px 0 rgba(27,22,34,.8);overflow-wrap:break-word;max-width:100%}
/* two cards she has linked: drawn touching, across the groups, over the link's line */
.cf-link{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 8px 6px;align-self:center;min-width:0}
.cf-pair{display:flex;justify-content:center;align-items:flex-start;width:100%}
.cf-pair .cf-card{width:min(46%, 170px);padding-left:0;padding-right:0}
.cf-pair .cf-pic{width:100%}
.cf-pair .cf-card:first-child .cf-pic{transform:rotate(-5deg) translateX(5px)}
.cf-pair .cf-card:last-child .cf-pic{transform:rotate(5deg) translateX(-5px)}
.cf-pair .cf-line{padding:0 8px}
.cf-linkline{margin:0;font-family:var(--shout);font-size:1.5em;letter-spacing:.04em;line-height:1.05;color:var(--gold);text-shadow:2px 2px 0 var(--ink);text-align:center}
.cf-none{margin:18px 0;text-align:center;font-weight:700;color:var(--cream)}
/* one card, shown large */
.cf-in.big{max-width:720px}
.cf-bigcard{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:4px 0 6px;cursor:pointer}
.cf-bigpic{display:block;width:min(72%, 340px, calc((100dvh - 290px) * .8));min-width:150px;transform:rotate(-1.5deg);filter:drop-shadow(5px 6px 0 rgba(20,30,12,.5))}
.cf-bigpic svg{display:block;width:100%;height:auto}
.cf-bigline{margin:0;font-weight:700;font-size:1.3em;line-height:1.2;text-align:center;color:var(--ink);background:#e9dcc0;border:3px solid var(--ink);border-radius:6px 14px 8px 12px;padding:.4em .85em;box-shadow:4px 4px 0 rgba(0,0,0,.35);max-width:22em}
.cf-means{margin:0;display:flex;align-items:center;gap:.55em;font-weight:700;color:var(--cream);text-shadow:1.5px 1.5px 0 rgba(27,22,34,.8)}
/* side by side on a wide screen: what she saw on the left, what she was told on the right; two
   cards she has linked lie between the groups, touching, one from each side */
@media (min-width: 960px){
  .cf-groups{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"eye ear" "link link"}
  .cf-groups.linked{grid-template-columns:minmax(0,3fr) minmax(260px,2fr) minmax(0,2.2fr);grid-template-areas:"eye link ear"}
  .cf-groups.linked .cf-group.ear .cf-cards{grid-template-columns:repeat(2, minmax(0, 1fr))}
  .cf-groups.one{grid-template-columns:minmax(0,1fr);grid-template-areas:"ear" "link" "eye"}
}
/* a phone: two cards across, and the row of bark takes the room it needs */
@media (max-width: 520px){
  .cf-cards{grid-template-columns:repeat(2, minmax(0, 1fr))}
  .bar.has-file{gap:2px}
  .bar.has-file .iconbtn{width:38px;height:38px}
  .cn-pic{width:76px}
}
@media (max-width: 640px) and (orientation: portrait){
  .panel.bark-panel{aspect-ratio:auto}
  .bark-panel .art{position:relative;inset:auto;height:auto;min-height:56vw}
  .bark-row .bark{flex-basis:42%}
  .bark-row.n1 .bark{flex-basis:52%}
}

/* ---------- chapter 5: the things she taps, the questions she taps out, the roar that grows ---------- */
/* the page's own soft glow on a thing a frame asks her to tap (the old tom's nose, a tuft of fur, a
   patch of mud, an otter bursting with questions): it pulses softly; a tap on it makes it flare, a tap
   anywhere else gets a small answer (a wobble, and a word lettered small beside it: "snnnrrk…") */
.tapspot.soft svg{animation:softglow 1.7s ease-in-out infinite}
.th-glow{fill:rgba(255,236,150,.3)}
.th-ring{fill:none;stroke:#fff3c2;stroke-width:4;stroke-dasharray:10 8;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,214,70,.95))}
@keyframes softglow{0%,100%{transform:scale(.86);opacity:.62}50%{transform:scale(1.04);opacity:1}}
.tapspot.soft.twinkle svg{animation:softno .5s ease-in-out 1}
@keyframes softno{0%,100%{transform:scale(.9) rotate(0)}25%{transform:scale(1) rotate(-12deg)}55%{transform:scale(1) rotate(10deg)}80%{transform:scale(.95) rotate(-5deg)}}
.tapspot.soft.flare svg{animation:softyes .7s ease-out 1 forwards}
@keyframes softyes{0%{transform:scale(1);opacity:1}60%{transform:scale(2.2);opacity:.9}100%{transform:scale(3);opacity:0}}
.tapspot.soft.hop{animation:spothop .5s ease-out 1}
@keyframes spothop{0%,100%{transform:translate(-50%,-50%)}35%{transform:translate(-50%,-80%)}65%{transform:translate(-50%,-46%)}}
.tapmiss{position:absolute;transform:translate(-50%,-50%) rotate(-5deg);font-family:var(--shout);font-size:clamp(16px, 2.4vw, 30px);letter-spacing:.05em;line-height:1;white-space:nowrap;color:#fff6dc;
  text-shadow:2px 2px 0 var(--ink),-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink);pointer-events:none;z-index:2;animation:tapmiss 1.3s ease-out both}
@keyframes tapmiss{0%{opacity:0;transform:translate(-50%,-30%) rotate(-5deg) scale(.5)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-5deg) scale(1.1)}75%{opacity:1;transform:translate(-50%,-56%) rotate(-5deg) scale(1)}100%{opacity:0;transform:translate(-46%,-68%) rotate(-3deg) scale(1)}}
/* nine claws in the log: the frame's own scene stays up, and the roar is lettered along its top, a
   little larger at each step (rrr… RRR…) */
.skipsfx{position:absolute;left:3%;right:3%;top:3%;text-align:center;font-family:var(--shout);letter-spacing:.07em;line-height:1;white-space:nowrap;color:var(--gold);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);pointer-events:none}
.skipsfx.s1{font-size:clamp(18px, 3vw, 44px);color:#fff6dc;opacity:.92}
.skipsfx.s2{font-size:clamp(26px, 4.6vw, 68px)}
.skipsfx.s3{font-size:clamp(36px, 6.4vw, 96px)}
.skipsfx.pop{transform-origin:50% 40%}
/* her paws counted aboard in words ("One. Two."), not digits */
.counter.words{font-family:var(--comic);font-size:1.12em;letter-spacing:0}
/* the questions she has tapped out already, small, under the panel: all of them can be read back */
.asked{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.8em;font-weight:700;line-height:1.25;color:var(--text-dim)}
.asked li{display:flex;flex-wrap:wrap;gap:0 .5em;align-items:baseline}
.asked q{quotes:"“" "”" "‘" "’"}
.asked q.a{color:var(--caption)}
/* her Case File: several lots of linked cards, side by side where there is room; three in a row
   when one card touches two, a line for each join (the first under the left pair and kept to that
   side, the second under the right and kept to that one, a little apart: two thoughts, not one) */
.cf-links{grid-area:link;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:12px 22px;align-self:center;min-width:0}
.cf-links .cf-link{grid-area:auto;flex:0 1 360px;align-self:auto}
.cf-links .cf-link.row{flex-basis:520px}
.cf-pair.n3 .cf-card{width:min(32%, 165px)}
.cf-pair.n3 .cf-card:nth-child(2) .cf-pic{transform:rotate(1.5deg) translateY(4px)}
.cf-link.row .cf-linkline{align-self:stretch;font-size:1.25em;text-wrap:balance}
.cf-link.row .cf-linkline.j0{text-align:left;padding-left:4%;padding-right:24%}
.cf-link.row .cf-linkline.j1{text-align:right;padding-left:24%;padding-right:4%;margin-top:7px}
@media (min-width: 960px){
  .cf-groups.linked.many{grid-template-columns:minmax(0,2.5fr) minmax(340px,2.7fr) minmax(0,2fr)}
  .cf-groups.linked.many .cf-group.eye .cf-cards{grid-template-columns:repeat(2, minmax(0, 1fr))}
}

/* ---------- grown-ups ---------- */
.leaf{position:relative;width:36px;height:36px;border-radius:50%;flex:none;opacity:.4;
  display:grid;place-items:center;color:var(--leaf);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.leaf svg{width:20px;height:20px;position:relative}
.leaf .ring{position:absolute;inset:0;width:36px;height:36px;transform:rotate(-90deg)}
.leaf .ring circle{fill:none;stroke:var(--leaf);stroke-width:3;stroke-dasharray:113;stroke-dashoffset:113}
.leaf.holding{opacity:1}
.leaf.holding .ring circle{transition:stroke-dashoffset 1.5s linear;stroke-dashoffset:0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.72);display:flex;align-items:flex-start;justify-content:center;
  padding:calc(16px + var(--st)) calc(12px + var(--sr)) calc(16px + var(--sb)) calc(12px + var(--sl));overflow:auto}
.sheet-in{background:#fbf8f2;color:#222;border-radius:14px;max-width:880px;width:100%;padding:18px 18px 24px;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
.sheet-in h2{margin:0 0 4px;font-size:22px}
.sheet-in h3{margin:18px 0 6px;font-size:18px;border-top:1px solid #ddd;padding-top:14px}
.sheet-in h4{margin:12px 0 4px;font-size:15px}
.sheet-in h5{margin:10px 0 2px;font-size:14px;color:#555}
.sheet-in table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.sheet-in th,.sheet-in td{border-bottom:1px solid #e3e0da;padding:5px 6px;text-align:right}
.sheet-in th:first-child,.sheet-in td:first-child{text-align:left}
.sheet-in .muted{color:#777}
.sheet-in .gbtn{border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 12px;min-height:40px;margin:4px 6px 0 0}
.sheet-in .gbtn.warn{border-color:#c44;color:#a22}
.sheet-in .close{float:right}
.sheet-in dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:6px 0}
.sheet-in dt{color:#666}
.sheet-in dd{margin:0}
.sheet-in .scroll{overflow-x:auto}

.err{max-width:560px;margin:40px auto;text-align:center}

/* ---------- landscape: text column on the left, the panel on the right (a picture-book spread) ---------- */
@media (orientation: landscape) and (min-width: 700px){
  .frame{display:grid;grid-template-columns:minmax(300px, 0.5fr) minmax(0, 1fr);grid-template-areas:"col panel";gap:22px;max-width:1500px;align-items:center;min-height:calc(100dvh - var(--bar) - var(--st) - 40px)}
  .frame .col{grid-area:col;display:flex;flex-direction:column;gap:12px;min-width:0;padding-bottom:8px}
  .frame .panel-side{grid-area:panel;align-self:start;position:sticky;top:calc(var(--bar) + var(--st) + 12px);min-height:calc(100dvh - var(--bar) - var(--st) - 40px)}
  .panel{width:min(100%, calc((100dvh - var(--bar) - var(--st) - 40px) * 1.6))}
  .next-row{position:static}
  .next-row .btn.big,.row.end .btn.big{padding-left:1em;padding-right:1em}
  /* the lesson column holds the question and the keypad; the look chooser's swatches run 5-6 a row */
  .frame[data-kind="lesson"]{grid-template-columns:minmax(380px, .62fr) minmax(0, 1fr)}
  .frame[data-kind="look"],.frame[data-kind="choice"]{grid-template-columns:minmax(460px, .8fr) minmax(0, 1fr)}
  .frame[data-kind="look"]{grid-template-columns:minmax(460px, 1fr) minmax(0, 1fr)}
  .frame[data-kind="look"] .look{gap:8px}
  .frame[data-kind="look"] .sw svg{width:50px;height:50px}
  .frame[data-kind="look"] .look h3{margin-bottom:4px}
  html.big .choice{padding-top:.32em;padding-bottom:.32em;min-height:54px}
}
@media (orientation: landscape) and (min-width: 700px){
  .frame.solo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .frame.solo .panel-side{position:static;min-height:0;width:100%}
  .frame.solo .panel,.frame.solo .col{width:min(100%, calc((100dvh - var(--bar) - var(--st) - 118px) * 1.6))}
  .frame.solo .col{padding-bottom:0;order:2}
  /* a frame that gives her a card: the panel leaves room under it for the card and the buttons */
  .frame.solo.has-card .panel,.frame.solo.has-card .col{width:min(100%, calc((100dvh - var(--bar) - var(--st) - 252px) * 1.6))}
}
@media (orientation: landscape) and (min-width: 700px) and (max-height: 500px){
  :root{--bar:48px}
  .iconbtn{width:40px;height:40px}
}
/* a phone held sideways: the lesson's question, balloon and whole keypad fit without scrolling */
@media (orientation: landscape) and (max-height: 500px){
  .frame[data-kind="lesson"]{gap:14px;min-height:0}
  .frame[data-kind="lesson"] .col{gap:6px;padding-bottom:0}
  .frame[data-kind="lesson"] .stack{gap:6px}
  .frame[data-kind="lesson"] .sb{font-size:.86em;padding:.3em .7em .35em;margin-top:0}
  .frame[data-kind="lesson"] .sface{width:38px;height:38px}
  .frame[data-kind="lesson"] .counts{gap:6px}
  .frame[data-kind="lesson"] .q{font-size:clamp(36px, 11cqi, 52px)}
  .frame[data-kind="lesson"] .keypad{gap:6px;max-width:300px}
  .frame[data-kind="lesson"] .key{min-height:44px;font-size:26px;border-radius:12px}
  .frame[data-kind="lesson"] .key.del svg{width:26px;height:26px}
  .frame[data-kind="lesson"] .panel-side{min-height:0}
  .frame[data-kind="lesson"] .panel{width:min(100%, calc((100dvh - var(--bar) - var(--st) - 60px) * 1.6))}
}
@media (max-width: 520px){
  :root{--gap:12px}
  .bar{gap:4px}   /* room for the name beside Camp, Read to me, Aa and Who's playing */
  .bar-title small{display:none}
  .iconbtn{width:42px;height:42px}
  .iconbtn svg{width:24px;height:24px}
  .key{min-height:58px;font-size:30px}
  .catcard{min-height:220px}
  .catcard .face{width:120px;height:105px}
  .cats{gap:12px}
  .cats .catcard{width:calc(50% - 6px)}
  .sw{width:76px}
  .sw svg{width:52px;height:52px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .fx-shake{animation:none!important}
  .fx-flash .flash{animation:none!important}
  /* no wiggle: the glowing cat's glow flares instead */
  .pc-hop.wiggle .pc-next{opacity:1;stroke-width:7;fill:#ffe27a}
  /* chapter 4: the Case File's curl lights up when a card goes in; the glint brightens; the word stays a moment */
  .filebtn.got,.filebtn.nudge{border-color:var(--gold);box-shadow:0 0 20px 8px rgba(255,210,63,.95)}
  .tapspot.flare svg{animation:none!important;transform:scale(1.9)}
  .tapspot.twinkle svg{animation:none!important;transform:rotate(45deg) scale(1.2)}
  .art [data-art="glint"].flare{animation:none!important;transform:scale(1.7)}
  .art [data-art="glint"].twinkle{animation:none!important;transform:rotate(45deg) scale(1.2)}
  .bark.wiggle .bark-pic{filter:drop-shadow(0 0 20px rgba(255,236,150,1)) drop-shadow(4px 5px 0 rgba(70,48,22,.38))}
  .skritch{animation:none!important;opacity:1}
  /* chapter 5: the soft glow brightens on a tap and ripples on a miss; the small word stays a moment */
  .tapspot.soft.flare svg{transform:scale(1.5)}
  .tapspot.soft.twinkle svg{transform:scale(1.1)}
  .tapspot.soft.hop{animation:none!important}
  .tapmiss{animation:none!important;opacity:1}
}

/* ---------- print: the book page only ---------- */
@media print{
  @page{margin:14mm}
  html.big{--scale:1}
  body{background:#fff!important;color:#000}
  .bar,.leaf,.links,.coming,.no-print,.sheet,.cfile{display:none!important}
  #screen{padding:0;min-height:0}
  .book{box-shadow:none;border:3px solid #000;max-width:none;font-size:12pt;padding:8mm 10mm}
  /* each chapter on its own printed page; one chapter alone fits the first page with the title */
  .book .bookpage{break-inside:avoid}
  .book .bookpage + .bookpage{break-before:page;border-top:0;margin-top:0;padding-top:0}
  .book h2.chap{font-size:18pt;margin:2mm 0}
  .book h1,.book h1.long{text-shadow:none;color:#000;font-size:30pt}
  .book .chap{margin:1mm 0 2mm}
  .book .portrait{width:50mm;margin:2mm auto 4mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .book p{margin:0 0 .4em;line-height:1.3}
  .book .dream{margin-top:3mm;padding:.4em .7em;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .book .sig{margin-top:2mm}
  .book .dn-pic,.book .dragonet.sil .dn-pic svg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .book .dn-draw{min-height:70mm}
  /* chapter 5: with three dragonets or four the page runs on to a second sheet, between two of them */
  .book .bookpage.dragonets{break-inside:auto}
  .book .dragonet{break-inside:avoid}
}

    </button>
